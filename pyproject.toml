[project]
name = "minebot"
version = "0.1.0"
description = "Python brain/controller for a Minecraft bot -- drives a companion client mod (minebot-mod) over a local WebSocket control channel instead of speaking the Minecraft protocol directly"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minebot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
